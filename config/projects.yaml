        ticker: ETH
        label: Ethereum
        is_matching_eligible: true
        uri_scheme: ethereum
        verification: public
      sol:
        address: "DYw8jCTfwHNRJhhmFcbXvVDTqWMEVFBX6ZKUmG5vpesT"
        ticker: SOL
        label: Solana
        is_matching_eligible: true
