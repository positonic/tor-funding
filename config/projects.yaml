# Source-of-truth project + address config.
# Consumed by the tracker (apps/tracker/src/config/projects.yaml loader) to
# seed the DB and to know which addresses to watch. The web app reads
# long-form copy via getStaticProps at build time.
#
# Spec references:
#   §6   — per-chain matching eligibility rules
#   §10  — view key handling
#   §13  — snapshot contract
#   §14.1 — tracker process structure
#   §6.4 — onboarding artifact shape
#
# HOW TO ADD A PROJECT: see config/README.md.
# HOW TO ADD A CHAIN:   see config/README.md.
#
# NOTE: addresses below are placeholders lifted from sample-data/snapshot.json.
#       They MUST be replaced with real, project-controlled addresses before
#       launch (May 19, 2026).

version: 1

projects:
  - id: anti-censorship
    name: "Anti-Censorship Team"
    short_desc: "Bridges, pluggable transports, and circumvention tools"
    long_desc_md: |
      The Anti-Censorship Team builds the tools that keep Tor reachable
      from networks that try to block it. That includes **bridges**
      (unpublished Tor entry nodes), **pluggable transports** (obfs4,
      Snowflake, WebTunnel, meek) that make Tor traffic look like
      ordinary web traffic, and the **circumvention infrastructure**
      that routes users in heavily-censored regions onto the network.

      Your donation directly funds engineering and network operations
      for the people in Iran, Russia, China, and elsewhere who rely on
      Tor to reach the uncensored internet.
    order_index: 1
    active: true
    matching_eligible_chains: [btc, eth, sol, zec_t, xmr]
    donation_addresses:
      btc:
        address: "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh"
        ticker: BTC
        label: Bitcoin
        is_matching_eligible: true
        uri_scheme: bitcoin
        verification: public
        btcpay_store_id: "store_anti_censorship"
      eth:
