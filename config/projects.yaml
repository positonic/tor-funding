  - id: arti
    name: "Arti — Tor in Rust"
    short_desc: "Next-generation Tor implementation"
    long_desc_md: |
      Arti is the ongoing rewrite of the Tor protocol stack in Rust.
      It's designed to be embeddable as a library, memory-safe by
      construction, and easier for third parties to audit. Once it
      reaches feature parity with the C implementation, it will become
      the default Tor client.

      Your donation funds the core Rust engineering team: protocol
      implementation, async runtime work, API stabilisation, and the
      long tail of spec-compliance work required before the cutover.
    order_index: 3
    active: true
    matching_eligible_chains: [btc, eth, xmr]
