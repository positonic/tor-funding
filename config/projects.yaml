  - id: tor-browser
    name: "Tor Browser"
    short_desc: "The anonymous browser used by millions"
    long_desc_md: |
      Tor Browser is the most widely-used privacy-preserving web browser
      in the world. It ships hardened defaults, fingerprinting
      resistance, and first-party isolation on top of Firefox ESR, and
      it routes every request through the Tor network by default.

      Funding here goes to browser engineering: security releases,
      Android parity, usability work, and the long tail of fingerprint-
      ing defences that keep Tor Browser one step ahead of commercial
      tracking.
    order_index: 2
    active: true
    matching_eligible_chains: [btc, eth, sol, zec_t]
    donation_addresses:
